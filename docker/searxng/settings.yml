# SearXNG settings override for Campaign Tracker.
#
# `use_default_settings: true` merges this file with the image's shipped
# searx/settings.yml, so we only have to state what this project actually
# needs changed — everything else (engines, UI, etc.) stays at the image's
# defaults:
#
#   - search.formats: the image ships with only "html" enabled. statements.py
#     queries SearXNG with format=json (see statements.py's _searxng_search);
#     against a default install that returns a 403. Adding "json" here is the
#     one thing this project actually requires.
#
#   - server.secret_key: the value below is a placeholder ("ultrasecretkey")
#     that setup replaces in-place with a real random value via `sed` — see
#     docker/searxng/README.md, the ONE place this setup command is
#     documented (run.sh deliberately does not carry its own copy — it just
#     points here). The placeholder string here MUST match the sed target in
#     the README exactly, or the rotation step silently no-ops and every
#     clone ships the same known secret_key (SECURITY.md
#     HIGH finding, fixed 2026-09-07 — this file's shipped value, this
#     comment's claimed placeholder, and the sed targets in two separate
#     copies of the setup instructions had drifted to three DIFFERENT
#     strings, so `sed` never matched anything and exited 0 with nothing
#     rotated; keeping the instructions in exactly one file is part of the
#     fix, not incidental). NOTE: Docker Compose's ${VAR} interpolation
#     only applies to the compose file itself at parse time; it does NOT
#     expand inside files bind-mounted into the container (this file), and
#     SearXNG's own YAML loader doesn't expand ${...} either. So this has to
#     be a literal string swapped before first run, not an env var read at
#     container start — same mechanism the official searxng-docker project
#     uses for the same reason.
#
# Deliberately NOT touched: server.limiter. It defaults to false in the base
# settings, which is what we want — this instance serves one local script
# calling its own JSON API, not the public internet, so there's no bot
# traffic to rate-limit. Turning the limiter on would require a Valkey/Redis
# container this minimal compose file doesn't run, and would start blocking
# statements.py's own queries.
#
#   - engines: disabling `brave` (2026-09-07 fix, real-run finding). This is
#     the free SearXNG "brave" engine — an HTML SCRAPER of brave.com/search,
#     not the paid Brave Search API (that's the separate `braveapi` engine,
#     inactive by default; CLAUDE.md's "no paid search" rule is about that
#     one, unrelated to this fix). A live run against this project's own
#     instance returned "0 statements gathered" on a real candidate for
#     several searches in a row; manually curling
#     `/search?q=test&format=json` and reading the response's
#     "unresponsive_engines" key showed `["brave", "too many requests"]` —
#     Brave's anti-bot defense blocks this scraper fast, even from a single
#     low-volume self-hosted instance issuing statements.py's ~10
#     sequential queries per candidate search. A blocked engine doesn't
#     silently drop out cleanly; it can eat the per-engine timeout budget on
#     every query and degrade the whole search, which is a worse failure
#     mode than one fewer engine's worth of results. Disabling it here is a
#     server-side settings.yml default (not a per-browser cookie), so it
#     applies to statements.py's cookie-less JSON requests the same as to a
#     browser hitting the UI. If another general-category engine (e.g.
#     duckduckgo, startpage — both mentioned in CLAUDE.md as occasionally
#     rate-limited together with brave) starts showing the same pattern in
#     "unresponsive_engines", add it the same way below rather than
#     replacing the whole engines list — `use_default_settings: true` means
#     any engine NOT listed here still gets the shipped defaults, and only
#     the field(s) you set on a listed engine (by `name`) are overridden.
use_default_settings: true

server:
  secret_key: "ultrasecretkey"  # replaced by setup's sed step — see README.md

search:
  formats:
    - html
    - json

engines:
  - name: brave
    disabled: true
